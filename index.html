<title>業務週報表</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
/* Layout: app bar with week switcher; left column = week summary + entry form, right column = day-by-day timeline. Stacks on phones. */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --ink: #17211d;
  --muted: #5b6862;
  --line: #dde3e0;
  --accent: #1f6f5c;
  --accent-soft: #e2f0eb;
  --on-accent: #ffffff;
  --warn: #a4541a;
  --warn-soft: #fbeee2;
  --danger: #b3261e;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --surface: #19211e; --ink: #e6ece9; --muted: #97a59f; --line: #2b3632;
    --accent: #5cc3a5; --accent-soft: #1d3530; --on-accent: #0d1a16;
    --warn: #e7a26a; --warn-soft: #3a2a1d; --danger: #ff8a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715; --surface: #19211e; --ink: #e6ece9; --muted: #97a59f; --line: #2b3632;
  --accent: #5cc3a5; --accent-soft: #1d3530; --on-accent: #0d1a16;
  --warn: #e7a26a; --warn-soft: #3a2a1d; --danger: #ff8a80; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.appbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.brand { display: flex; flex-direction: column; }
.brand h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: .02em; text-wrap: balance; }
.brand span { color: var(--muted); font-size: 13px; }
.weeknav { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
.weeknav .label { padding: 0 10px; text-align: center; min-width: 0; }
.weeknav .label b { display: block; font-size: 14px; }
.weeknav .label small { font-family: var(--font-data); color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 7px 12px; }
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon-btn { width: 36px; height: 36px; padding: 0; border: none; font-size: 18px; }
.btn-primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 500; }
.btn-ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 4px 8px; font-size: 13px; }
.btn-ghost:hover { color: var(--ink); border-color: var(--line); }
.btn-danger { color: var(--danger); }
.btn-danger.armed { background: var(--danger); color: var(--surface); border-color: var(--danger); }

.layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 0; }
.panel h2 { margin: 0 0 12px; font-size: 15px; font-weight: 700; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { display: flex; flex-direction: column; }
.stat b { font-family: var(--font-data); font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.warn b { color: var(--warn); }
.week-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.week-actions button { flex: 1 1 auto; font-size: 13px; }

form { display: flex; flex-direction: column; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 13px; color: var(--muted); font-weight: 500; }
.field label em { color: var(--danger); font-style: normal; }
input, textarea, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
textarea { resize: vertical; min-height: 84px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip:hover { border-color: var(--accent); }
.editing-note { font-size: 13px; color: var(--accent); background: var(--accent-soft); padding: 6px 10px; border-radius: 6px; }
datalist { display: none; }

.main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toolbar input { flex: 1 1 220px; background: var(--surface); }
.day { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; }
.day-head { padding-top: 4px; text-align: center; }
.day-head .dow { font-size: 13px; color: var(--muted); }
.day-head .dnum { font-family: var(--font-data); font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.day.today .dnum { color: var(--accent); }
.day.today .dow::after { content: " · 今天"; color: var(--accent); }
.day-body { display: flex; flex-direction: column; gap: 10px; min-width: 0; border-left: 1px solid var(--line); padding-left: 14px; padding-block: 2px 8px; }
.day-empty { color: var(--muted); font-size: 13px; padding-block: 6px; }
.entry { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.entry-top { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
.client { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.loc { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.loc::before { content: "📍 "; }
.content { white-space: pre-wrap; overflow-wrap: anywhere; }
.follow { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; background: var(--warn-soft); border-radius: 8px; padding: 8px 10px; }
.follow.done { background: var(--accent-soft); }
.follow.done .ftext { text-decoration: line-through; color: var(--muted); }
.follow input { width: auto; margin-top: 4px; accent-color: var(--accent); }
.follow .ftag { font-weight: 500; color: var(--warn); white-space: nowrap; }
.follow.done .ftag { color: var(--accent); }
.ftext { overflow-wrap: anywhere; min-width: 0; }
.entry-actions { display: flex; gap: 4px; justify-content: flex-end; }
.state { text-align: center; color: var(--muted); padding: 40px 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 20; }
.copy-fallback { width: 100%; min-height: 160px; font-family: var(--font-data); font-size: 12px; margin-top: 10px; }
@media (prefers-reduced-motion: no-preference) { .entry { transition: border-color .15s; } .entry:hover { border-color: var(--accent); } }
</style>

<div class="wrap">
  <header class="appbar">
    <div class="brand">
      <h1>業務週報表</h1>
      <span>記錄每次拜訪的地點、客戶與談論內容</span>
    </div>
    <div class="weeknav" role="group" aria-label="切換週次">
      <button class="icon-btn" id="prevWeek" aria-label="上一週">‹</button>
      <div class="label"><b id="weekTitle">本週</b><small id="weekRange"></small></div>
      <button class="icon-btn" id="nextWeek" aria-label="下一週">›</button>
      <button id="thisWeek" class="btn-ghost">回本週</button>
    </div>
  </header>

  <div class="layout">
    <aside class="side">
      <section class="panel" aria-labelledby="sumTitle">
        <h2 id="sumTitle">本週摘要</h2>
        <div class="stats">
          <div class="stat"><b id="sVisits">0</b><span>筆紀錄</span></div>
          <div class="stat"><b id="sClients">0</b><span>位客戶</span></div>
          <div class="stat warn"><b id="sOpen">0</b><span>待追蹤</span></div>
        </div>
        <div class="week-actions">
          <button id="copyReport">複製週報文字</button>
          <button id="exportCsv" class="btn-primary" hidden>匯出業務週報表 (Excel)</button>
        </div>
        <div class="field" style="margin-top:12px"><label for="fStaff">報表右上角業務員欄</label><input id="fStaff" value="業務一部業務員:" placeholder="例：業務一部業務員:王小明" autocomplete="off"></div>
        <textarea id="copyFallback" class="copy-fallback" hidden readonly aria-label="週報文字"></textarea>
      </section>

      <section class="panel" aria-labelledby="formTitle">
        <h2 id="formTitle">新增紀錄</h2>
        <form id="entryForm" novalidate>
          <div id="editingNote" class="editing-note" hidden>正在編輯一筆紀錄</div>
          <div class="field"><label for="fDate">日期 <em>*</em></label><input type="date" id="fDate" required></div>
          <div class="field"><label for="fLoc">地點 <em>*</em></label>
          <div class="chips" role="group" aria-label="常用地點"><button type="button" class="chip" data-loc="空白">空白</button></div>
          <select id="fLoc" required>
            <option value="">請選擇地點</option>
            <option>公司</option><option>電洽</option>
            <optgroup label="北部"><option>基隆市</option><option>台北市</option><option>新北市</option><option>桃園市</option><option>新竹市</option><option>新竹縣</option><option>宜蘭縣</option></optgroup>
            <optgroup label="中部"><option>苗栗縣</option><option>台中市</option><option>彰化縣</option><option>南投縣</option><option>雲林縣</option></optgroup>
            <optgroup label="南部"><option>嘉義市</option><option>嘉義縣</option><option>台南市</option><option>高雄市</option><option>屏東縣</option></optgroup>
            <optgroup label="東部"><option>花蓮縣</option><option>台東縣</option></optgroup>
            <optgroup label="離島"><option>澎湖縣</option><option>金門縣</option><option>連江縣</option></optgroup>
            
          </select></div>
          <div class="field"><label for="fClient">客戶名稱 <em>*</em></label>
            <div class="chips" role="group" aria-label="常用客戶"><button type="button" class="chip" data-client="空白">空白</button><button type="button" class="chip" data-client="公司">公司</button></div>
            <input id="fClient" list="clientList" placeholder="點上方選項，或輸入公司名稱" autocomplete="off" required></div>
          <div class="row2">
            <div class="field"><label for="fPerson">拜訪人姓名</label><input id="fPerson" list="personList" placeholder="例：王大明" autocomplete="off"></div>
            <div class="field"><label for="fTitle">職位</label><select id="fTitle"><option value="">請選擇職位</option><option>老闆</option><option>老闆娘</option><option>總經理</option><option>副總</option><option>經理</option><option>副理</option><option>主任</option><option>工程師</option><option>先生</option><option>小姐</option></select></div>
          </div>
          <datalist id="personList"></datalist>

          <div class="field"><label for="fContent">談論工作內容 <em>*</em></label>
            <div class="chips" role="group" aria-label="常用內容"><button type="button" class="chip" data-preset="特休">特休</button><button type="button" class="chip" data-preset="連假">連假</button><button type="button" class="chip" data-preset="送發票" data-append="1">送發票</button><button type="button" class="chip" data-preset="現場場勘" data-append="1">現場場勘</button><button type="button" class="chip" data-preset="討論圖面" data-append="1">討論圖面</button><button type="button" class="chip" data-preset="追蹤帳款" data-append="1">追蹤帳款</button><button type="button" class="chip" data-preset="送筆記本" data-append="1">送筆記本</button><button type="button" class="chip" data-preset="業務週會議">業務週會議</button><button type="button" class="chip" data-preset="送中秋禮盒" data-append="1">送中秋禮盒</button><button type="button" class="chip" data-preset="關心近期狀況" data-append="1">關心近期狀況</button><button type="button" class="chip" data-preset="追蹤工程進度" data-append="1">追蹤工程進度</button><button type="button" class="chip" data-preset="確認進場時間" data-append="1">確認進場時間</button><button type="button" class="chip" data-preset="確認拆架時間" data-append="1">確認拆架時間</button></div>
            <textarea id="fContent" placeholder="點上方選項，或自行輸入會談重點、需求、結論…" required></textarea></div>
          <div class="field"><label for="fFollow">後續追蹤事項</label><input id="fFollow" placeholder="例：週三前寄報價單" autocomplete="off"></div>
          <div id="formError" class="field" hidden><span style="color:var(--danger);font-size:13px" id="formErrorText"></span></div>
          <div class="form-actions">
            <button type="button" id="cancelEdit" class="btn-ghost" hidden>取消編輯</button>
            <button type="submit" class="btn-primary" id="saveBtn">儲存紀錄</button>
          </div>
        </form>
        <datalist id="clientList"></datalist>
        <datalist id="locList"></datalist>
      </section>
    </aside>

    <main class="main">
      <div class="toolbar">
        <input type="search" id="search" placeholder="搜尋客戶、地點或內容（搜尋全部週次）" aria-label="搜尋紀錄">
      </div>
      <div id="list"><div class="state">正在載入紀錄…</div></div>
    </main>
  </div>
</div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const DOW = ["日", "一", "二", "三", "四", "五", "六"];
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const mondayOf = (d) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const w = (x.getDay() + 6) % 7; x.setDate(x.getDate() - w); return x; };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const isoWeek = (d) => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 86400000 + 1) / 7); };
  const md = (d) => `${d.getMonth() + 1}/${d.getDate()}`;

  let weekStart = mondayOf(new Date());
  let entries = [];
  let loaded = false;
  let db = null, col = null, prof = null, downloads = null;
  let editingId = null;
  let armedDelete = null;

  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2200);
  }

  const phoneLast = (x) => (x.location === "電洽" ? 1 : 0);
  const byDateTime = (a, b) => a.date.localeCompare(b.date) || phoneLast(a) - phoneLast(b) || (a.createdAt || 0) - (b.createdAt || 0);
  const isBlank = (v) => !v || v === "無" || v === "空白";
  function weekEntries() {
    const s = ymd(weekStart), e = ymd(addDays(weekStart, 6));
    return entries.filter((x) => x.date >= s && x.date <= e);
  }

  function renderHeader() {
    const end = addDays(weekStart, 6);
    const thisMon = ymd(mondayOf(new Date()));
    const diff = Math.round((weekStart - parse(thisMon)) / (7 * 86400000));
    $("weekTitle").textContent = diff === 0 ? "本週" : diff === -1 ? "上週" : diff === 1 ? "下週" : `第 ${isoWeek(weekStart)} 週`;
    $("weekRange").textContent = `${weekStart.getFullYear()} W${pad(isoWeek(weekStart))} · ${md(weekStart)}–${md(end)}`;
    $("sumTitle").textContent = diff === 0 ? "本週摘要" : `${md(weekStart)}–${md(end)} 摘要`;
    $("thisWeek").hidden = diff === 0;
  }

  function renderStats() {
    const w = weekEntries();
    $("sVisits").textContent = w.length;
    $("sClients").textContent = new Set(w.map((x) => x.client.trim())).size;
    $("sOpen").textContent = w.filter((x) => x.followup && !x.done).length;
  }

  function renderLists() {
    const fill = (id, vals) => {
      const el = $(id); el.textContent = "";
      [...new Set(vals.filter(Boolean))].sort().forEach((v) => { const o = document.createElement("option"); o.value = v; el.appendChild(o); });
    };
    fill("clientList", ["空白", ...entries.map((x) => x.client)]);
    fill("locList", entries.map((x) => x.location));
    fill("personList", entries.map((x) => x.person));
  }

  function entryEl(x, showDate) {
    const card = document.createElement("article");
    card.className = "entry";
    const top = document.createElement("div"); top.className = "entry-top";
    const c = document.createElement("span"); c.className = "client"; c.textContent = isBlank(x.client) ? "" : x.client; top.appendChild(c);
    if (!isBlank(x.location)) { const l = document.createElement("span"); l.className = "loc"; l.textContent = x.location; top.appendChild(l); }
    if (showDate) { const d = document.createElement("span"); d.className = "loc"; d.style.cssText = "font-family:var(--font-data)"; const dt = parse(x.date); d.textContent = `${x.date}（${DOW[dt.getDay()]}）`; d.classList.remove("loc"); d.style.color = "var(--muted)"; d.style.fontSize = "13px"; top.appendChild(d); }
    card.appendChild(top);
    const body = document.createElement("div"); body.className = "content"; body.textContent = fullContent(x); card.appendChild(body);
    if (x.followup) {
      const f = document.createElement("label"); f.className = "follow" + (x.done ? " done" : "");
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = !!x.done; cb.id = "done-" + x.id;
      cb.setAttribute("aria-label", "標記後續事項完成");
      cb.addEventListener("change", () => toggleDone(x, cb.checked));
      const tag = document.createElement("span"); tag.className = "ftag"; tag.textContent = x.done ? "已完成" : "待追蹤";
      const tx = document.createElement("span"); tx.className = "ftext"; tx.textContent = x.followup;
      f.append(cb, tag, tx); card.appendChild(f);
    }
    if (db) {
      const act = document.createElement("div"); act.className = "entry-actions";
      const ed = document.createElement("button"); ed.className = "btn-ghost"; ed.textContent = "編輯"; ed.addEventListener("click", () => startEdit(x));
      const del = document.createElement("button"); del.className = "btn-ghost btn-danger"; del.textContent = "刪除";
      if (armedDelete === x.id) { del.classList.add("armed"); del.textContent = "確定刪除？"; }
      del.addEventListener("click", () => onDelete(x));
      act.append(ed, del); card.appendChild(act);
    }
    return card;
  }

  function renderList() {
    const list = $("list"); list.textContent = "";
    if (!loaded) { const s = document.createElement("div"); s.className = "state"; s.textContent = db === false ? "請先登入 Claude 帳號，再重新開啟此頁，才能記錄與儲存你的工作紀錄。" : "正在載入紀錄…"; list.appendChild(s); return; }
    const q = $("search").value.trim().toLowerCase();
    if (q) {
      const hits = entries.filter((x) => [x.client, x.location, x.content, x.followup, x.person, x.title].some((v) => (v || "").toLowerCase().includes(q)))
        .sort((a, b) => b.date.localeCompare(a.date));
      const wrap = document.createElement("div"); wrap.style.cssText = "display:flex;flex-direction:column;gap:10px";
      const h = document.createElement("div"); h.style.cssText = "color:var(--muted);font-size:13px"; h.textContent = `找到 ${hits.length} 筆符合「${q}」的紀錄`;
      wrap.appendChild(h);
      hits.forEach((x) => wrap.appendChild(entryEl(x, true)));
      list.appendChild(wrap); return;
    }
    const w = weekEntries();
    if (!entries.length) {
      const s = document.createElement("div"); s.className = "state";
      s.innerHTML = "<b>還沒有任何紀錄</b><br>在左側填寫日期、地點、客戶名稱與談論內容，按「儲存紀錄」就會出現在這裡。";
      list.appendChild(s); return;
    }
    const today = ymd(new Date());
    const container = document.createElement("div"); container.style.cssText = "display:flex;flex-direction:column;gap:6px";
    for (let i = 0; i < 7; i++) {

    $("formTitle").textContent = "新增紀錄"; $("saveBtn").textContent = "儲存紀錄";

  function startEdit(x) {

    $("fDate").value = x.date; setLoc(x.location || ""); $("fClient").value = x.client; $("fPerson").value = x.person || ""; setOpt("fTitle", x.title || ""); titleTouched = !!x.title;

    $("formTitle").textContent = "編輯紀錄"; $("saveBtn").textContent = "儲存變更";

  function showError(msg) { $("formErrorText").textContent = msg; $("formError").hidden = !msg; }

  function setLoc(v) { setOpt("fLoc", v); }
  function setOpt(id, v) {
    const sel = $(id);
    if (v && ![...sel.options].some((o) => o.value === v)) { const o = document.createElement("option"); o.textContent = v; sel.appendChild(o); }
    sel.value = v;

  async function onSubmit(ev) {
    ev.preventDefault();
    if (!col) { showError("紀錄資料庫尚未連線，無法儲存。"); return; }
    const date = $("fDate").value, client = $("fClient").value.trim(), content = $("fContent").value.trim();
    const leave = content === "特休" || content === "連假";
    if (!date || !content) { showError("請填寫日期與談論工作內容。"); return; }
    if (!leave && (!$("fLoc").value.trim() || !client)) { showError("請填寫地點與客戶名稱（特休、連假可不填）。"); return; }
    showError("");
    const prev = editingId ? entries.find((x) => x.id === editingId) : null;
    const now = Date.now();
    const data = {
      date, client, content,
      location: $("fLoc").value.trim(),
      person: $("fPerson").value.trim(),
      title: $("fTitle").value.trim(),
      followup: $("fFollow").value.trim(),
      done: prev ? !!prev.done : false,
      createdAt: prev ? (prev.createdAt || now) : now,
      updatedAt: now,
    };
    $("saveBtn").disabled = true;
    try {
      if (editingId) await col.doc(editingId).set(data); else await col.add(data);
      const ws = mondayOf(parse(date));
      if (ymd(ws) !== ymd(weekStart)) { weekStart = ws; }
      toast(prev ? "已更新紀錄" : "已儲存紀錄");
      resetForm(); render();
    } catch (e) {
      showError(e && e.code === "quota_exceeded" ? "紀錄數量已達上限，請刪除舊紀錄後再試。" : e && e.code === "invalid_argument" ? "你目前只有檢視權限，無法儲存。請向分享者申請「可使用（Contributor）」以上的權限。" : "儲存失敗，請稍後再試一次。");
    } finally { $("saveBtn").disabled = false; }
  }

  async function toggleDone(x, done) {

    catch { toast("更新失敗，請再試一次"); render(); }
  }

  async function onDelete(x) {
    if (armedDelete !== x.id) { armedDelete = x.id; renderList(); setTimeout(() => { if (armedDelete === x.id) { armedDelete = null; renderList(); } }, 4000); return; }
    armedDelete = null;

  function reportText() {
    const end = addDays(weekStart, 6);
    const w = weekEntries().sort(byDateTime);
    const lines = [`工作週報 ${ymd(weekStart)} ~ ${ymd(end)}（第 ${isoWeek(weekStart)} 週）`, `共 ${w.length} 筆紀錄，${new Set(w.map((x) => x.client)).size} 位客戶`, ""];
    let last = "";
    w.forEach((x) => {
      if (x.date !== last) { const d = parse(x.date); lines.push(`【${md(d)}（${DOW[d.getDay()]}）】`); last = x.date; }
      lines.push(`・客戶：${isBlank(x.client) ? "" : x.client}${isBlank(x.location) ? "" : `　地點：${x.location}`}`);
      lines.push(`  內容：${fullContent(x).replace(/\n/g, "\n        ")}`);
      if (x.followup) lines.push(`  後續：${x.followup}${x.done ? "（已完成）" : ""}`);
    });
    if (!w.length) lines.push("本週尚無紀錄。");
    return lines.join("\n");
  }

  async function copyReport() {
    const text = reportText();
    try { await navigator.clipboard.writeText(text); toast("已複製週報文字"); $("copyFallback").hidden = true; }
    catch { const ta = $("copyFallback"); ta.value = text; ta.hidden = false; ta.focus(); ta.select(); toast("請按 Ctrl+C 複製已選取的文字"); }
  }

function contentUnits(s, size) { let u = 0; for (const ch of String(s)) u += (/[\u0000-ÿ]/.test(ch) ? 1.1 : 2.1) * size / 11; return u; }

function fitRow(ws, row) {

  let lines = 1, lineHeight = 19.8;

function fillTemplate(ws, opts) {

  const pad = (n) => String(n).padStart(2, "0");

  const DOW = ["一","二","三","四","五"];
  ws.getCell("A2").value = `週期:第${zhNum(opts.week)}週`;
  ws.getCell("E2").value = opts.staff;
  const overflow = [];
  for (let i = 0; i < 5; i++) {
    const d = new Date(opts.monday.getFullYear(), opts.monday.getMonth(), opts.monday.getDate() + i);
    const top = 4 + i * 8;
    ws.getCell(`A${top}`).value = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    ws.getCell(`B${top}`).value = DOW[i];
    const items = opts.entries.filter((x) => x.date === ymd(d));
    const notes = [];
    for (let r = 0; r < 8; r++) {
      const row = top + r;
      const x = items[r];
      const blank = (v) => (!v || v === "無" || v === "空白") ? null : v;
      ws.getCell(`C${row}`).value = x ? blank(x.location) : null;
      ws.getCell(`D${row}`).value = x ? blank(x.client) : null;

      const ec = ws.getCell(`E${row}`);

      if (text === "特休" || text === "連假") ec.style = { ...ec.style, alignment: { ...(ec.style.alignment || {}), horizontal: "center", vertical: "middle" } };
      if (x) fitRow(ws, row);
      if (x && x.followup) notes.push(`${x.client}：${x.followup}${x.done ? "(已完成)" : ""}`);
    }
    ws.getCell(`F${top}`).value = notes.length ? notes.join("\n") : null;
    const fc = ws.getCell(`F${top}`);
    if (notes.length) fc.style = { ...fc.style, alignment: { ...(fc.style.alignment || {}), wrapText: true, vertical: "top" } };
  }

}

    if (!window.ExcelJS) { toast("Excel 元件尚未載入，請稍後再試"); return; }
    try {
      const bin = atob(TEMPLATE_B64); const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const wb = new ExcelJS.Workbook();
      await wb.xlsx.load(bytes.buffer);
      const ws = wb.worksheets[0];
      const week = isoWeek(weekStart);
      const all = weekEntries().sort(byDateTime);
      ws.getColumn(1).width = 16;
      ws.getColumn(3).width = 13;
      ws.getColumn(4).width = 15;
      const needE = Math.max(0, ...all.map((x) => contentUnits(fullContent(x).replace(/\s*\n\s*/g, "；"), 12)));
      ws.getColumn(5).width = Math.min(150, Math.max(ws.getColumn(5).width || 67.78, Math.ceil(needE + 2)));
      const overflow = fillTemplate(ws, { monday: weekStart, week, staff: $("fStaff").value.trim(), entries: all });
      ws.name = `${weekStart.getFullYear()}-第${week}週`;
      ws.pageSetup = { ...ws.pageSetup, paperSize: 9, orientation: "landscape", fitToPage: true, fitToWidth: 1, fitToHeight: 0 };
      ws.getCell("A1").value = "業 務 週 報 表";
      const weekend = all.filter((x) => parse(x.date).getDay() % 6 === 0).length;
      const buf = await wb.xlsx.writeBuffer();
      const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      await downloads.save({ filename: `業務週報表_第${week}週_${ymd(weekStart)}.xlsx`, data: blob });
      if (weekend) toast(`週末有 ${weekend} 筆紀錄，範本只有週一到週五，未列入`);
      else if (overflow.length) toast("有一天超過 8 筆，多出的已併入當天第 8 列");
    } catch (e) {
      if (!(e && e.code === "declined")) toast("匯出未完成，請再試一次");
    }
  }

  async function saveStaff() {
    if (!db) return;
    if (!prof) return;
    try { await prof.set({ staff: $("fStaff").value.trim() }); toast("已儲存業務員欄"); } catch {}
  }

  $("prevWeek").addEventListener("click", () => { weekStart = addDays(weekStart, -7); if (!editingId) resetForm(); render(); });
  $("nextWeek").addEventListener("click", () => { weekStart = addDays(weekStart, 7); if (!editingId) resetForm(); render(); });
  $("thisWeek").addEventListener("click", () => { weekStart = mondayOf(new Date()); if (!editingId) resetForm(); render(); });
  $("entryForm").addEventListener("submit", onSubmit);
  $("cancelEdit").addEventListener("click", resetForm);
  let titleTouched = false;
  $("fTitle").addEventListener("change", () => { titleTouched = true; });
  $("entryForm").addEventListener("reset", () => { titleTouched = false; });
  const autoTitle = () => {
    if (titleTouched) return;
    const name = $("fPerson").value.trim();
    if (!name) return;
    const client = $("fClient").value.trim();
    const past = entries.filter((x) => x.person === name && x.title && x.id !== editingId)
      .sort((a, b) => ((b.client === client) - (a.client === client)) || (b.updatedAt || 0) - (a.updatedAt || 0));
    if (past.length) setOpt("fTitle", past[0].title);
  };
  $("fPerson").addEventListener("input", autoTitle);
  $("fPerson").addEventListener("change", autoTitle);
  document.querySelectorAll(".chip[data-loc]").forEach((b) => b.addEventListener("click", () => { setLoc(b.dataset.loc); $("fLoc").focus(); }));
  document.querySelectorAll(".chip[data-client]").forEach((b) => b.addEventListener("click", () => { $("fClient").value = b.dataset.client; $("fClient").focus(); }));
  document.querySelectorAll(".chip[data-preset]").forEach((b) => b.addEventListener("click", () => {
    const p = b.dataset.preset;
    const cur = $("fContent").value.trim();
    if (b.dataset.append && cur && !/^(特休|連假|業務週會議)$/.test(cur)) { if (!cur.includes(p)) $("fContent").value = cur + "、" + p; }
    else $("fContent").value = p;
    if (p === "業務週會議") { if (!$("fLoc").value) setLoc("公司"); if (!$("fClient").value.trim()) $("fClient").value = "公司"; }
    $("fContent").focus();
  }));
  $("fStaff").addEventListener("change", saveStaff);
  $("copyReport").addEventListener("click", copyReport);
  $("exportCsv").addEventListener("click", exportCsv);
  $("search").addEventListener("input", renderList);

  resetForm(); render();

  (async () => {
    const c = window.claude;
    if (!c || !c.use) { db = false; loaded = false; renderList(); return; }
    try { downloads = await c.use("downloads"); if (downloads) $("exportCsv").hidden = false; } catch {}
    db = await c.use("db");
    if (!db) { db = false; renderList(); return; }
    const user = await c.use("user");
    const uid = user ? await user.id() : null;
    if (!uid) { db = false; renderList(); return; }
    prof = db.doc("data/users/" + uid + "/profile");
    col = prof.collection("entries");
    prof.get().then((d) => { if (d.exists && d.data().staff && document.activeElement !== $("fStaff")) $("fStaff").value = d.data().staff; }).catch(() => {});
    col.orderBy("date", "asc").limit(1000).onSnapshot((snap) => {
      entries = snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((x) => x.date && x.content);
      loaded = true; renderLists(); render();
    }, () => { loaded = true; render(); toast("紀錄同步中斷，請重新整理頁面"); });
  })();
})();
</script>
